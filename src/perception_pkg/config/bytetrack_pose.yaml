# 측면/가려짐 구간에서 트랙 ID를 더 오래 유지하기 위한 ByteTrack 설정.
# 기본(bytetrack.yaml) 대비 track_buffer를 늘려 잠깐 사라진 사람을 같은 ID로
# 다시 잇고, 저신뢰(측면) 검출도 2차 association으로 트랙에 붙인다.
tracker_type: bytetrack
track_high_thresh: 0.25   # 1차 association 임계 (낮춰 측면 중간신뢰 검출도 사용)
track_low_thresh: 0.1     # 2차 association 임계 (저신뢰 박스로 트랙 유지)
new_track_thresh: 0.35    # 새 트랙 생성 임계 (저신뢰로 잡트랙 남발 방지)
track_buffer: 60          # 잃은 트랙을 이 프레임 수만큼 유지 후 제거 (~2s@30fps)
match_thresh: 0.8         # 트랙 매칭 IoU 임계
fuse_score: True
